name: openthc

services:

  hub:
    container_name: hub.openthc.me
    image: openthc/web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./etc/Caddyfile:/etc/caddy/Caddyfile
      - ./volumes/hub/data:/data
      - ./volumes/hub/config:/config
    command: [ "caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile" ]
    healthcheck:
      test: [ "CMD", "/usr/bin/curl", "http://localhost/" ]
      interval: 8s
      timeout: 4s
      retries: 2


  # The SQL Database Service
  sql:
    container_name: sql.openthc.me
    image: openthc/sql
    environment:
      POSTGRES_PASSWORD: "passweed"
    healthcheck:
      test: [ "CMD", "/usr/bin/pg_isready", "--host=127.0.0.1", "--username=postgres" ]
      interval: 8s
      timeout: 4s
      retries: 4


  # The Redis System
  # @see https://github.com/nextcloud/all-in-one/discussions/1731
  rdb:
    container_name: rdb.openthc.me
    image: redis
    healthcheck:
      test: [ "CMD", "/usr/local/bin/redis-cli", "ping" ]
      interval: 8s
      timeout: 4s
      retries: 4


  # Open Policy Agent (ACL)
  # opa:
  #   container_name: opa.openthc.me
  #   image: opa


  # Single Sign On Services
  sso:
    container_name: sso.openthc.me
    image: openthc/sso
    depends_on:
      hub:
        condition: service_healthy
      sql:
        condition: service_healthy
      rdb:
        condition: service_healthy
    environment:
      OPENTHC_SERVER_NAME: "sso.openthc.me"
    env_file:
      - path: "./etc/demo.env"
        required: true
      - path: "./etc/live.env"
        required: false
    expose:
      - "80"


  # Compliance Reporting Engine
  cre:
    container_name: cre.openthc.me
    image: openthc/cre
    depends_on:
      - sso
    environment:
      OPENTHC_SERVER_NAME: "cre.openthc.me"
    env_file:
      - path: "./etc/demo.env"
        required: true
      - path: "./etc/live.env"
        required: false
    expose:
      - "80"


  # PIPE
  # pipe:
  #   container_name: pipe.openthc.me
  #   image: openthc/pipe
  #   depends_on:
  #     - sso
  #   environment:
  #     OPENTHC_SERVER_NAME: "pipe.openthc.me"
  #   env_file:
  #     - path: "./etc/demo.env"
  #       required: true
  #     - path: "./etc/live.env"
  #       required: false
  #   expose:
  #     - "80"


  # BONG
  # bong:
  #   container_name: bong.openthc.me
  #   image: openthc/bong
  #   depends_on:
  #     - sso
  #   environment:
  #     OPENTHC_SERVER_NAME: "bong.openthc.me"
  #   env_file:
  #     - path: "./etc/demo.env"
  #       required: true
  #     - path: "./etc/live.env"
  #       required: false
  #   expose:
  #     - "80"


  # Main Application / S2S / TNT
  app:
    container_name: app.openthc.me
    image: openthc/app
    depends_on:
      - sso
    environment:
      OPENTHC_SERVER_NAME: "app.openthc.me"
    env_file:
      - path: "./etc/demo.env"
        required: true
      - path: "./etc/live.env"
        required: false
    volumes:
      - ./etc/cre.yaml:/opt/openthc/app/etc/cre.yaml:ro
    expose:
      - "80"


  # Point of Sale
  pos:
    container_name: pos.openthc.me
    image: openthc/pos
    depends_on:
      - sso
    environment:
      OPENTHC_SERVER_NAME: "pos.openthc.me"
    env_file:
      - path: "./etc/demo.env"
        required: true
      - path: "./etc/live.env"
        required: false
    volumes:
      - ./etc/cre.yaml:/opt/openthc/pos/etc/cre.yaml:ro
    expose:
      - "80"


volumes:
  gfs:
    name: gfs.openthc.me
